name: "Code Checks"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  checkov-scan:
    name: Checkov Scan
    permissions:
      contents: read
      security-events: write # Allow the workflow to upload analysis results
      actions: read # Allow the workflow to read actions metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkov GitHub Action
        uses: bridgecrewio/checkov-action@v12.3075.0
        with:
          directory: .
          framework: terraform
          output_format: cli
          output_file_path: console

  codeql-checks:
    name: CodeQL Analysis
    permissions:
      contents: read
      security-events: write # Allow the workflow to upload analysis results
    strategy:
      matrix:
        language: [actions]
    uses: JackPlowman/reusable-workflows/.github/workflows/codeql-analysis.yml@e9dfe69334dc913550976dd48108f0014638b899 # v2026.10.26.01
    with:
      language: ${{ matrix.language }}

  common-code-checks:
    name: Common Code Checks
    permissions:
      contents: read
      actions: read # Allow the workflow to read actions metadata
      pull-requests: write # Allow the workflow to create and modify pull request comments
      security-events: write # Allow the workflow to upload analysis results
    uses: JackPlowman/reusable-workflows/.github/workflows/common-code-checks.yml@e9dfe69334dc913550976dd48108f0014638b899 # v2026.10.26.01
    secrets:
      workflow_github_token: ${{ secrets.GITHUB_TOKEN }}

  tflint-scan:
    name: TFLint Scan
    permissions:
      contents: read
      actions: read # Allow the workflow to read actions metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6.3.2
        with:
          tflint_version: v0.66.0
      - name: TFLint Init
        run: just tflint-init
      - name: TFLint Check
        run: just tflint-check

  tofu-validate:
    name: Tofu Validate
    permissions:
      contents: read
      security-events: write # Allow the workflow to upload analysis results
      actions: read # Allow the workflow to read actions metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Just
        uses: extractions/setup-just@v4.0.0
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: 1.13.9
      - name: Tofu Init
        run: just tofu-init
      - name: Tofu Validate
        run: just tofu-validate
